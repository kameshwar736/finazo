<!doctype html>
<html lang="en" class="loading">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Finanzo | Finance Skills for a Brighter Future</title>
    <style>
      /* ==========================================================================
         FINANZO BRAND PRELOADER (FROM CONTACT US TEMPLATE)
         ========================================================================== */
      .loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #ffffff;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        visibility: visible;
        opacity: 1;
        transition: opacity 0.7s ease, visibility 0s 0.7s;
      }

      .loader.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loading {
        overflow: hidden;
      }

      .loader img {
        width: min(220px, 54vw);
        height: auto;
        display: block;
        transition: opacity 0.45s ease, transform 0.45s ease;
        animation: lg-in 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
      }

      .loader .track {
        width: min(220px, 54vw);
        height: 2px;
        background: #e3e6f4;
        overflow: hidden;
        transition: opacity 0.45s ease, transform 0.45s ease;
        border-radius: 2px;
      }

      .loader .bar {
        display: block;
        height: 100%;
        background: #0101ff;
        transform: scaleX(0);
        transform-origin: left;
        animation: lg-fill 2s cubic-bezier(0.65, 0, 0.35, 1) 0.35s forwards;
      }

      .loader.done img,
      .loader.done .track {
        opacity: 0;
        transform: scale(0.93);
      }

      @keyframes lg-in {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }

      @keyframes lg-fill {
        to {
          transform: scaleX(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader {
          display: none !important;
        }
        .loading {
          overflow: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Brand Preloader -->
    <div class="loader" id="loader" role="status" aria-label="Loading Finanzo">
      <img src="/LOGO.png" alt="Finanzo Logo" />
      <div class="track"><span class="bar"></span></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        var d = document.documentElement;
        var l = document.getElementById('loader');
        if (!l) return;
        var t0 = Date.now();
        var fin = false;

        function end() {
          if (fin) return;
          fin = true;
          l.classList.add('done');
          setTimeout(function () {
            d.classList.remove('loading');
          }, 450);
          setTimeout(function () {
            if (l && l.parentNode) {
              l.parentNode.removeChild(l);
            }
          }, 1400);
        }

        function go() {
          setTimeout(end, Math.max(0, 2200 - (Date.now() - t0)));
        }

        if (document.readyState === 'complete') {
          go();
        } else {
          window.addEventListener('load', go);
        }

        // Safety timeout
        setTimeout(end, 5000);
      })();
    </script>
  </body>
</html>
