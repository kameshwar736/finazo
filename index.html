    /* ==========================================================================
         FULL-SCREEN PAGE LOADER (MATCHING UI & BEHAVIOUR SPECIFICATION)
         ========================================================================== */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #ffffff;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 20px;
      visibility: visible;
      opacity: 1;
      transition: opacity 0.7s ease, visibility 0s 0.7s;
    }

    .loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* 1. The logo fades in and rises about 14px (0.9s, ease-out) */
    .loader img {
      width: min(220px, 54vw);
      height: auto;
      display: block;
      transition: opacity 0.45s ease, transform 0.45s ease;
      animation: lg-in 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
    }

    /* Thin 2px progress line, same width as logo, with light grey track (#e3e6f4) */
    .loader .track {
      width: min(220px, 54vw);
      height: 2px;
      background: #e3e6f4;
      overflow: hidden;
      transition: opacity 0.45s ease, transform 0.45s ease;
      border-radius: 2px;
    }

    /* 2. After 0.35s delay, blue progress bar fills left to right over 2s (#0101ff) */
    .loader .bar {
      display: block;
      height: 100%;
      background: #0101ff;
      transform: scaleX(0);
      transform-origin: left;
      animation: lg-fill 2s cubic-bezier(0.65, 0, 0.35, 1) 0.35s forwards;
    }

    /* 3. When loading finishes, logo and bar fade out and shrink slightly (scale 0.93, 0.45s) */
    .loader.done img,
    .loader.done .track {
      opacity: 0;
      transform: scale(0.93);
    }

    @keyframes lg-in {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
    }

    @keyframes lg-fill {
      to {
        transform: scaleX(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader {
        display: none !important;
      }

      .loading,
      html.loading,
      html.loading body {
        overflow: auto !important;
      }

      html.loading *:not(.loader, .loader *) {
        animation-play-state: running !important;
      }
    }
  </style>

  <script>
    (function () {
      // Respect prefers-reduced-motion by skipping the loader entirely
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.remove('loading');
        var el = document.getElementById('loader');
        if (el && el.parentNode) el.parentNode.removeChild(el);
        return;
      }

      var d = document.documentElement;
      var l = document.getElementById('loader');
      if (!l) return;
      var t0 = Date.now();
      var fin = false;

      function end() {
        if (fin) return;
        fin = true;
        // 3. Logo and bar fade out & shrink (scale 0.93, 0.45s)
        l.classList.add('done');

        // 4 & 5. White overlay fades out over 0.7s; page content animations unpause and play right after
        setTimeout(function () {
          d.classList.remove('loading');
        }, 450);

        // Remove loader DOM element from the page after transition completes
        setTimeout(function () {
          if (l && l.parentNode) {
            l.parentNode.removeChild(l);
          }
        }, 1200);
      }

      function onReady() {
        // Show for at least 2.5 seconds, and also wait for window.load to complete
        var elapsed = Date.now() - t0;
        var waitTime = Math.max(0, 2500 - elapsed);
        setTimeout(end, waitTime);
      }

      if (document.readyState === 'complete') {
        onReady();
      } else {
        window.addEventListener('load', onReady);
      }

      // Safety timeout so the loader never hangs longer than 6 seconds
      setTimeout(end, 6000);
    })();
  </script>
