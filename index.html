<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Finanzo | Finance Skills for a Brighter Future</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }

    /* Finanzo Brand Preloader */
    .loader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999999;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      visibility: visible;
      opacity: 1;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
      pointer-events: all;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader img {
      width: min(220px, 54vw);
      height: auto;
      max-height: 80px;
      object-fit: contain;
      display: block;
      margin: 0;
      padding: 0;
      transition: opacity 0.45s ease, transform 0.45s ease;
      animation: lg-in 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
    }

    .loader .track {
      width: min(220px, 54vw) !important;
      height: 2px !important;
      min-height: 2px !important;
      max-height: 2px !important;
      background: #e3e6f4 !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      display: block !important;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .loader .bar {
      display: block !important;
      height: 2px !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #0101ff !important;
      transform: scaleX(0);
      transform-origin: left;
      animation: lg-fill 2s cubic-bezier(0.65, 0, 0.35, 1) 0.35s forwards;
    }

    .loader.done img,
    .loader.done .track {
      opacity: 0;
      transform: scale(0.93);
    }

    @keyframes lg-in {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes lg-fill {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }
  </style>
</head>

<body>
  <div class="loader" id="loader" role="status" aria-label="Loading">
    <img src="/LOGO.png" alt="Finanzo" width="220" />
    <div class="track"><span class="bar"></span></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <script>
    (function () {
      var l = document.getElementById('loader');
      if (!l) return;
      var t0 = Date.now();
      var minDuration = 2200;
      var dismissed = false;

      function end() {
        if (dismissed) return;
        dismissed = true;
        var elapsed = Date.now() - t0;
        var remaining = Math.max(0, minDuration - elapsed);
        setTimeout(function () {
          if (l) {
            l.classList.add('done');
            setTimeout(function () {
              if (l && l.parentNode) {
                l.parentNode.removeChild(l);
              }
            }, 700);
          }
        }, remaining);
      }

      if (document.readyState === 'complete') {
        end();
      } else {
        window.addEventListener('load', end);
        setTimeout(end, 4000);
      }
    })();
  </script>
</body>

</html>
